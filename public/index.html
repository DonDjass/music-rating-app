<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music App — Fiche morceau</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone">
    <nav class="top-tabs">
      <button class="top-tab" id="tab-my-ratings" type="button">Mes notations</button>
      <button class="top-tab" id="tab-search" type="button">Recherche</button>
      <span class="top-tab-spacer"></span>
    </nav>

    <section id="search-view">
      <h1 class="search-title">Chercher un morceau, un album, un artiste</h1>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Titre, artiste ou album…" autocomplete="off" />
        <button id="search-btn" class="search-btn" type="button">Rechercher</button>
      </div>
      <p id="search-status" class="search-status" hidden></p>

      <div class="category-tabs">
        <button class="category-tab active" id="cat-tracks" type="button">Morceaux</button>
        <button class="category-tab" id="cat-albums" type="button">Album</button>
        <button class="category-tab" id="cat-artists" type="button">Artiste</button>
      </div>
      <ul id="results-list" class="search-results"></ul>
    </section>

    <section id="drilldown-view" hidden>
      <button id="back-from-drilldown" class="drilldown-back" type="button">← Retour aux résultats</button>
      <h1 class="search-title" id="drilldown-title">—</h1>
      <p id="drilldown-status" class="search-status" hidden></p>
      <ul id="drilldown-results" class="search-results"></ul>
    </section>

    <section id="my-ratings-view" hidden>
      <h1 class="search-title">Mes notations</h1>
      <p id="my-ratings-status" class="search-status" hidden></p>
      <ul id="my-ratings-results" class="search-results"></ul>
    </section>

    <section id="track-view" hidden>
      <div class="track-nav-row" id="track-nav-row" hidden>
        <button id="prev-track-btn" class="track-nav-btn" type="button">‹ Précédent</button>
        <button id="next-track-btn" class="track-nav-btn" type="button">Suivant ›</button>
      </div>

      <header class="track-header" id="track-header">
        <div class="cover-art" aria-hidden="true">♪</div>
        <div class="track-meta">
          <h1 id="track-title">—</h1>
          <p class="artist" id="track-artist">—</p>
          <p class="album" id="track-album">—</p>
          <p class="tags" id="track-tags">—</p>
          <div class="header-actions">
            <button class="play-btn" type="button">▶ Écouter le morceau</button>
            <button class="like-btn" id="like-btn" type="button" aria-label="Favori">♡</button>
          </div>
        </div>
      </header>

      <section class="notation-card">
      <div class="notation-title-row">
        <h2>MA NOTATION <span class="global-inline">- <span id="global-value">—</span>/10</span></h2>
        <button id="classic-btn" class="classic-toggle" type="button">
          <span class="classic-word">Classic</span>
          <span class="classic-star" id="classic-star">☆</span>
        </button>
      </div>

      <!-- NOTE AU FEELING -->
      <div class="notation-block" id="feeling-block">
        <div class="rating-row">
          <button class="pill-toggle" id="feeling-toggle" type="button">
            NOTE AU FEELING <span class="pencil">✎</span>
          </button>
          <div class="slider-block">
            <div class="slider-line">
              <div class="slider-track-wrap">
                <input type="range" class="rating-slider" id="feeling-slider" min="0" max="10" step="1" value="0" disabled />
                <div class="slider-ticks"><span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span></div>
              </div>
              <span class="slider-value" id="feeling-value">—</span>
            </div>
          </div>
        </div>
        <div class="edit-actions" id="feeling-actions" hidden>
          <div class="btn-row">
            <button type="button" class="btn btn-grey" data-action="reset">Réinitialiser</button>
            <button type="button" class="btn btn-pink" data-action="cancel">Abandonner</button>
            <button type="button" class="btn btn-green" data-action="save">Enregistrer</button>
          </div>
        </div>
      </div>

      <hr class="divider" />

      <!-- NOTE PAR CRITERES -->
      <div class="notation-block" id="criteria-block">
        <div class="rating-row">
          <button class="pill-toggle" id="criteria-toggle" type="button">
            NOTE PAR CRITERES <span class="pencil">✎</span>
          </button>
          <div class="slider-block">
            <div class="slider-line">
              <div class="slider-track-wrap">
                <input type="range" class="rating-slider readonly-slider" id="criteria-slider" min="0" max="10" step="0.1" value="0" disabled />
                <div class="slider-ticks flush"><span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span></div>
              </div>
              <span class="slider-value" id="criteria-value">—</span>
            </div>
          </div>
        </div>

        <div class="criteria-breakdown">
          <div class="criteria-line">
            <span class="criteria-label">Performance</span>
            <input type="range" class="mini-slider" id="performance-slider" min="0" max="10" step="0.5" value="0" disabled />
            <span class="criteria-value" id="performance-value">—</span>
          </div>
          <div class="criteria-line">
            <span class="criteria-label">Texte</span>
            <input type="range" class="mini-slider" id="texte-slider" min="0" max="10" step="0.5" value="0" disabled />
            <span class="criteria-value" id="texte-value">—</span>
          </div>
          <div class="criteria-line">
            <span class="criteria-label">Production</span>
            <input type="range" class="mini-slider" id="production-slider" min="0" max="10" step="0.5" value="0" disabled />
            <span class="criteria-value" id="production-value">—</span>
          </div>
        </div>
        <div class="edit-actions" id="criteria-actions" hidden>
          <div class="btn-row">
            <button type="button" class="btn btn-grey" data-action="reset">Réinitialiser</button>
            <button type="button" class="btn btn-pink" data-action="cancel">Abandonner</button>
            <button type="button" class="btn btn-green" data-action="save">Enregistrer</button>
          </div>
        </div>
      </div>
    </section>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
